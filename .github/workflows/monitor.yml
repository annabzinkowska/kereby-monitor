name: kereby flat monitor

on:
  # cron-job.org invokes this through GitHub's workflow dispatch API.
  workflow_dispatch:

concurrency:
  group: kereby-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Commit state if it changed
        run: |
          if [ -z "$(git status --porcelain listings_state.json)" ]; then
            echo "State unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings_state.json
          git commit -m "Update listing state [skip ci]"
          # Another run or a manual push can land between checkout and push. Our
          # freshly parsed state is always the authoritative one, so replay it on
          # top of whatever origin has rather than failing and re-alerting later.
          for attempt in 1 2 3; do
            if git push; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected. Syncing with origin/main and retrying."
            cp listings_state.json "$RUNNER_TEMP/state.json"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/state.json" listings_state.json
            if [ -z "$(git status --porcelain listings_state.json)" ]; then
              echo "Origin already has this state. Nothing to push."
              exit 0
            fi
            git add listings_state.json
            git commit -m "Update listing state [skip ci]"
          done
          echo "Could not push state after 3 attempts."
          exit 1
